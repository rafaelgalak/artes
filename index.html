<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Artes · Galak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: lista vertical de carrosséis, cada um com tira de slides 4:5 rolando na horizontal */
:root{
  --bg:#171717; --panel:#1f1f1f; --line:#2c2c2c; --fg:#f2f2f0; --muted:#9a9a94; --lime:#D6FF68; --ink:#171717;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent:"Instrument Serif",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--display)}
.wrap{max-width:1100px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{margin:0;font:800 clamp(32px,6vw,52px)/1 var(--display);letter-spacing:-.04em;text-transform:uppercase}
h1 em{font:italic 400 1.05em var(--accent);color:var(--lime);letter-spacing:-.01em;text-transform:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--fg);font:800 13px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:9px 16px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:20px}
.car{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.car-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.car h2{margin:0;font:800 19px/1.2 var(--display);letter-spacing:-.02em}
.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-top:4px}
.pill{font:800 11px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.pronto{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.pill.postado{color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:800 12px var(--display);letter-spacing:.03em;text-transform:uppercase;padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.main{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.slide{flex:0 0 auto;width:min(200px,42vw);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.slide img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:#0f0f0f;display:block}
.slide a{color:var(--muted);font-size:12px;text-decoration:none}
.slide a:hover{color:var(--lime)}
details{margin-top:12px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{white-space:pre-wrap;font:500 14px/1.5 var(--display);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0 0;max-width:65ch}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--ink);font:800 13px var(--display);padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Banco de <em>artes</em></h1>
    <div class="tabs" role="group" aria-label="Filtrar por marca">
      <button class="tab" data-f="todos" aria-pressed="true">Todos</button>
      <button class="tab" data-f="heychamp" aria-pressed="false">HEYCHAMP</button>
      <button class="tab" data-f="pessoal" aria-pressed="false">Pessoal</button>
    </div>
  </header>
  <main class="list" id="list"><p class="empty">Carregando carrosséis…</p></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const base = new URL('.', location.href).href;
let dados = [], filtro = 'todos';
const $ = s => document.querySelector(s);
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); };
const url = (c, f) => base + c.pasta.split('/').map(encodeURIComponent).join('/') + '/' + encodeURIComponent(f);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const dataBR = d => d ? d.split('-').reverse().join('/') : '';

async function copiar(texto, msg) {
  try { await navigator.clipboard.writeText(texto); toast(msg); }
  catch { toast('Não deu pra copiar'); }
}

async function baixarZip(c, btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Gerando…';
  try {
    const zip = new JSZip();
    for (const f of c.slides) zip.file(f, await (await fetch(url(c, f))).blob());
    if (c.legenda) zip.file('legenda.txt', c.legenda);
    const blob = await zip.generateAsync({type: 'blob'});
    const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: c.pasta.split('/').pop() + '.zip'});
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch { toast('Falhou o download'); }
  btn.disabled = false; btn.textContent = old;
}

function render() {
  const lista = dados.filter(c => filtro === 'todos' || c.marca === filtro);
  if (!lista.length) { $('#list').innerHTML = '<p class="empty">Nenhum carrossel aqui ainda. Sobe uma pasta em <b>' + (filtro === 'todos' ? 'heychamp/ ou pessoal/' : filtro + '/') + '</b> no GitHub.</p>'; return; }
  $('#list').innerHTML = lista.map((c, i) => `
    <article class="car">
      <div class="car-top">
        <div>
          <h2>${esc(c.titulo)}</h2>
          <div class="meta"><span class="pill ${esc(c.status)}">${esc(c.status)}</span><span>${c.marca === 'heychamp' ? 'HEYCHAMP' : 'Pessoal'}</span><span>${dataBR(c.data)}</span><span>${c.slides.length} slides</span></div>
        </div>
        <div class="actions">
          <button class="btn main" data-zip="${i}">Baixar tudo (.zip)</button>
          <button class="btn" data-links="${i}">Copiar links</button>
          ${c.legenda ? `<button class="btn" data-leg="${i}">Copiar legenda</button>` : ''}
        </div>
      </div>
      <div class="strip">
        ${c.slides.map((f, n) => `<figure class="slide" style="margin:0"><a href="${url(c, f)}" target="_blank" rel="noopener"><img loading="lazy" src="${url(c, f)}" alt="${esc(c.titulo)}, slide ${n + 1}"></a><a href="${url(c, f)}" download>${n + 1}. ${esc(f)}</a></figure>`).join('')}
      </div>
      ${c.legenda ? `<details><summary>Ver legenda</summary><pre>${esc(c.legenda)}</pre></details>` : ''}
    </article>`).join('');
  $('#list').querySelectorAll('[data-zip]').forEach(b => b.onclick = () => baixarZip(lista[b.dataset.zip], b));
  $('#list').querySelectorAll('[data-links]').forEach(b => b.onclick = () => { const c = lista[b.dataset.links]; copiar(c.slides.map(f => url(c, f)).join('\n'), 'Links copiados'); });
  $('#list').querySelectorAll('[data-leg]').forEach(b => b.onclick = () => copiar(lista[b.dataset.leg].legenda, 'Legenda copiada'));
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  filtro = t.dataset.f;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x === t));
  render();
});

fetch('manifest.json', {cache: 'no-store'}).then(r => r.json()).then(j => { dados = j.carrosseis || []; render(); })
  .catch(() => { $('#list').innerHTML = '<p class="empty">Não achei o manifest.json. Espera a ação "Atualizar galeria" terminar no GitHub e recarrega.</p>'; });
</script>
</body>
</html>
